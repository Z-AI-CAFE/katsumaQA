/* ── Reset & Base ── */

<body>

<header>
  <div class="header-inner">
    <div class="site-title">勝間塾 公開質問ライブ Q&amp;Aアーカイブ</div>
    <div class="site-subtitle">公開ライブでの質問と回答の要約・タイムスタンプ付きアーカイブ</div>
  </div>
</header>

<div class="filter-bar">
  <div class="filter-inner">

    <!-- Search & Sort row -->
    <div class="filter-row search-row">
      <span class="filter-label">検索</span>
      <input type="search" class="search-input" id="search-input"
             placeholder="キーワードで絞り込む…" oninput="onSearchInput(this.value)">
      <button class="search-clear" id="search-clear" onclick="clearSearch()">✕ クリア</button>
      <div class="sort-group" style="margin-left:auto;">
        <button class="sort-btn active" id="sort-new" onclick="setSort('new')">新しい順</button>
        <button class="sort-btn"        id="sort-old" onclick="setSort('old')">古い順</button>
      </div>
    </div>

    <!-- Month filter -->
    <div class="filter-row">
      <span class="filter-label">月</span>
      <div id="month-filters"></div>
    </div>

    <!-- Tag filter -->
    <div class="filter-row">
      <span class="filter-label">タグ</span>
      <div id="tag-filters"></div>
    </div>

  </div>
</div>

<main>
  <div class="stats-bar">
    <div class="stats-count" id="stats-count"></div>
    <button class="clear-btn" id="clear-btn" onclick="clearFilters()">絞り込みを解除</button>
  </div>
  <div class="qa-list" id="qa-list"></div>
  <div class="empty-state" id="empty-state" style="display:none;">
    <p>該当するQ&Aが見つかりませんでした。</p>
  </div>
</main>

<footer>
  <p>データ出典: <a href="https://www.youtube.com/channel/UCWoiNwdr7EEjgs2waxe_QpA" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;text-underline-offset:2px;">勝間和代が徹底的にマニアックな話をするYouTube</a>&nbsp;／&nbsp;最終更新: 2026年5月</p>
  <p style="margin-top:6px;">このサイトは勝間塾の公開質問ライブのファンアーカイブです。動画・回答の著作権は勝間和代氏および勝間塾に帰属します。</p>
</footer>

<script>
// ── State ──────────────────────────────────────────────
let activeTag   = null;
let activeMonth = null;
let searchKw    = '';
let sortOrder   = 'new'; // 'new' | 'old'

// ── Build month list from data ──────────────────────────
function getMonths() {
  const map = new Map();
  QA_DATA.forEach(d => {
    const key = `${d.year}_${String(d.month).padStart(2,'0')}`;
    if (!map.has(key)) map.set(key, d.monthLabel);
  });
  return [...map.entries()]
    .sort((a, b) => b[0].localeCompare(a[0]))
    .map(([key, label]) => ({ key, label }));
}

// ── Sort toggle ────────────────────────────────────────
function setSort(order) {
  sortOrder = order;
  document.getElementById('sort-new').classList.toggle('active', order === 'new');
  document.getElementById('sort-old').classList.toggle('active', order === 'old');
  renderAll();
}

// ── Search input handler ───────────────────────────────
function onSearchInput(val) {
  searchKw = val.trim();
  const clearBtn = document.getElementById('search-clear');
  clearBtn.classList.toggle('visible', searchKw.length > 0);
  renderAll();
}

function clearSearch() {
  searchKw = '';
  const input = document.getElementById('search-input');
  input.value = '';
  document.getElementById('search-clear').classList.remove('visible');
  renderAll();
}

// ── Render filter buttons ──────────────────────────────
function renderFilters() {
  // Month buttons
  const monthContainer = document.getElementById('month-filters');
  monthContainer.innerHTML = '';
  const allMonthBtn = document.createElement('button');
  allMonthBtn.className = 'month-btn' + (activeMonth === null ? ' active' : '');
  allMonthBtn.textContent = 'すべて';
  allMonthBtn.onclick = () => { activeMonth = null; renderAll(); };
  monthContainer.appendChild(allMonthBtn);
  getMonths().forEach(({ key, label }) => {
    const btn = document.createElement('button');
    btn.className = 'month-btn' + (activeMonth === key ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => { activeMonth = key; renderAll(); };
    monthContainer.appendChild(btn);
  });

  // Tag buttons
  const tagContainer = document.getElementById('tag-filters');
  tagContainer.innerHTML = '';
  const allTagBtn = document.createElement('button');
  allTagBtn.className = 'tag-btn' + (activeTag === null ? ' active' : '');
  allTagBtn.textContent = 'すべて';
  allTagBtn.onclick = () => { activeTag = null; renderAll(); };
  tagContainer.appendChild(allTagBtn);
  ALL_TAGS.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn' + (activeTag === tag ? ' active' : '');
    btn.textContent = tag;
    btn.onclick = () => { activeTag = tag; renderAll(); };
    tagContainer.appendChild(btn);
  });
}

// ── Filter & sort data ─────────────────────────────────
function getFiltered() {
  const kwLower = searchKw.toLowerCase();
  let result = QA_DATA.filter(d => {
    const monthKey = `${d.year}_${String(d.month).padStart(2,'0')}`;
    const monthOk  = activeMonth === null || monthKey === activeMonth;
    const tagOk    = activeTag   === null || d.tag === activeTag;
    const kwOk     = !kwLower || [d.question, d.answer, d.name, d.tag, d.monthLabel]
                       .some(s => s.toLowerCase().includes(kwLower));
    return monthOk && tagOk && kwOk;
  });
  if (sortOrder === 'old') result = result.slice().reverse();
  return result;
}

// ── YouTube 埋め込みトグル ──────────────────────────────
function toggleEmbed(btn, videoId, seconds, timestamp) {
  const wrap = btn.closest('.card-footer').querySelector('.yt-embed-wrap');
  const isOpen = wrap.style.display !== 'none';
  if (isOpen) {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
    btn.textContent = '▶ ' + timestamp + ' から再生';
  } else {
    wrap.innerHTML = '<iframe src="https://www.youtube.com/embed/'
      + encodeURIComponent(videoId) + '?start=' + seconds + '&rel=0"'
      + ' allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"'
      + ' allowfullscreen loading="lazy"></iframe>';
    wrap.style.display = 'block';
    btn.textContent = '✕ 閉じる';
    // 展開後、スティッキーバーに隠れないようスクロール調整
    setTimeout(function() {
      const rect = wrap.getBoundingClientRect();
      const stickyH = 155; // header(~73px) + filter-bar(~82px)
      if (rect.top < stickyH) {
        window.scrollBy({ top: rect.top - stickyH - 8, behavior: 'smooth' });
      }
    }, 50);
  }
}

// ── Escape HTML ────────────────────────────────────────
function escHtml(str) {
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Highlight keyword ──────────────────────────────────
function highlight(escapedStr) {
  if (!searchKw) return escapedStr;
  const escaped = escHtml(searchKw);
  const re = new RegExp(escaped.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return escapedStr.replace(re, m => `<mark>${m}</mark>`);
}

// ── Render cards ───────────────────────────────────────
function renderCards(data) {
  const list  = document.getElementById('qa-list');
  const empty = document.getElementById('empty-state');
  list.innerHTML = '';
  if (data.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const groups = new Map();
  data.forEach(d => {
    if (!groups.has(d.monthLabel)) groups.set(d.monthLabel, []);
    groups.get(d.monthLabel).push(d);
  });

  const showGroupHeaders = activeMonth === null && !searchKw && getMonths().length > 1;

  groups.forEach((items, monthLabel) => {
    if (showGroupHeaders) {
      const header = document.createElement('div');
      header.className = 'month-group-header';
      header.textContent = monthLabel;
      list.appendChild(header);
    }
    items.forEach(d => {
      const card = document.createElement('div');
      card.className = 'qa-card';
      const qHtml = highlight(escHtml(d.question));
      const aHtml = highlight(escHtml(d.answer));
      const nHtml = highlight(escHtml(d.name));
      card.innerHTML = `
        <div class="card-meta">
          <span class="q-num">Q${d.qNum}</span>
          <span class="month-badge">${escHtml(d.monthLabel)}</span>
          <span class="name-badge">${nHtml}</span>
          <span class="tag-badge">${escHtml(d.tag)}</span>
        </div>
        <div class="q-section">
          <div class="q-label">Q</div>
          <div class="q-text">${qHtml}</div>
        </div>
        <div class="a-section">
          <div class="a-label">A</div>
          <div class="a-text">${aHtml}</div>
        </div>
        <div class="card-footer">
          <div class="yt-source">出典: <a href="https://www.youtube.com/channel/UCWoiNwdr7EEjgs2waxe_QpA" target="_blank" rel="noopener">勝間和代が徹底的にマニアックな話をするYouTube</a></div>
          <div class="yt-actions">
            <button class="yt-embed-btn" onclick="toggleEmbed(this,'${d.videoId}',${d.seconds},'${escHtml(d.timestamp)}')">▶ ${escHtml(d.timestamp)} から再生</button>
          </div>
          <div class="yt-embed-wrap" style="display:none;"></div>
        </div>
      `;
      list.appendChild(card);
    });
  });
}

// ── Stats & clear button ───────────────────────────────
function renderStats(data) {
  const el    = document.getElementById('stats-count');
  const total = QA_DATA.length;
  const hasFilter = activeTag !== null || activeMonth !== null || searchKw;
  if (!hasFilter) {
    el.innerHTML = `<strong>${total}</strong> 件`;
  } else {
    let hint = '';
    if (searchKw) hint += `「${escHtml(searchKw)}」`;
    el.innerHTML = `<strong>${data.length}</strong> 件表示中${hint}（全 ${total} 件）`;
  }
  const clearBtn = document.getElementById('clear-btn');
  if (activeTag !== null || activeMonth !== null) {
    clearBtn.classList.add('visible');
  } else {
    clearBtn.classList.remove('visible');
  }
}

// ── Clear all filters ──────────────────────────────────
function clearFilters() {
  activeTag   = null;
  activeMonth = null;
  renderAll();
}

// ── Full render cycle ──────────────────────────────────
function renderAll() {
  const data = getFiltered();
  renderFilters();
  renderCards(data);
  renderStats(data);
}

// ── Init ───────────────────────────────────────────────
renderAll();
</script>

</body>
</html>
